spring.datasource.url=jdbc:h2:mem:essentials-test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Tests must not call the real OpenStreetMap servers.
app.osm.enabled=false
app.osm.overpass-urls=http://localhost:9/unused
app.osm.nominatim-url=http://localhost:9/unused
app.osm.user-agent=EssentialsFinderTests
app.osm.timeout-seconds=2
app.osm.cache-hours=24
app.cors.allowed-origins=http://localhost:5173
app.auth.token-valid-days=7
