spring.application.name=essentials-finder
server.port=${PORT:8080}

# ---------- MySQL ----------
# Override with environment variables, e.g. DB_PASSWORD=secret ./mvnw spring-boot:run
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/essentials_finder?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate creates/updates the tables from the @Entity classes on startup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

# ---------- OpenStreetMap ----------
app.osm.enabled=${OSM_ENABLED:true}
app.osm.overpass-urls=${OVERPASS_URLS:https://overpass-api.de/api/interpreter,https://overpass.private.coffee/api/interpreter}
app.osm.nominatim-url=${NOMINATIM_URL:https://nominatim.openstreetmap.org}
app.osm.user-agent=NearestEssentialsFinder/1.0 (+https://github.com/CodeXAniket/Nearest_Essentials_finder)
app.osm.timeout-seconds=20
# A downloaded area is reused for this many hours before it is refreshed.
app.osm.cache-hours=24

# ---------- Web ----------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.auth.token-valid-days=7
